version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: usn_postgres
    environment:
      POSTGRES_USER: usn_user
      POSTGRES_PASSWORD: usn_password
      POSTGRES_DB: usn_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data: